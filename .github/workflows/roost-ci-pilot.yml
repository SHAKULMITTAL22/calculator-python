name: Calculator CI pilot

on:
  push:
    branches:
      - 'roost/incident-pilot/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run application tests
        run: python -m pytest -q --junitxml=test-results/junit.xml
      - name: Retain the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calculator-test-report
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 7
